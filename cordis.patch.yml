# dsh-stl-preview bundle patch: one plugin row.
#
# A patch replaces the targeted row's whole `config`, so a profile that wants to
# override one key must restate the others it cares about. Every key below also
# has a code-side default in lib/config.js, so this file stays valid even when a
# patch-side helper is unavailable.
#
# `routePath` must stay under /api: the connection service authenticates every
# /api request (Host/Origin fence + browser session cookie) before the route
# runs, which is what keeps an arbitrary local file from being readable by a
# cross-site page.

- insert:
    - id: stl-preview
      name: dsh-stl-preview
      config:
        enabled: true
        routePath: /api/stl-preview
        extensions:
          - stl
        # A sliced model can be large; the route streams it, the browser parses
        # it in place. 512 MiB covers typical print files.
        maxBytes: 536870912
        # One ranged read at a time; the response body is a sequence of these.
        chunkBytes: 1048576
        # STL is unitless. 1 means "read the file as millimetres", which is what
        # most slicers write. Set 10 for centimetres, 25.4 for inches, etc.
        unitScale: 1
        # Viewport colour (sRGB hex); STL has no materials.
        color: "#c7d2e2"
        # Watertightness needs vertex welding and an edge map; skip it above
        # this triangle count instead of freezing the tab.
        analysisMaxTriangles: 400000
